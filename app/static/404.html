<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CrunchAI · Page not found</title>
  <link rel="icon" type="image/png" href="/assets/mark-128.png" />
  <script>
    (function () {
      var d = document.documentElement, t;
      try { t = localStorage.getItem("crunch-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      d.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body class="page-body">
  <header class="nav page-nav">
    <a class="brand" href="/" aria-label="CrunchAI home">
      <img src="/assets/mark-128.png" alt="" width="32" height="32" />
      <span>Crunch<span class="ai">AI</span></span>
    </a>
  </header>
  <main class="notfound">
    <p class="eyebrow">404</p>
    <h1 class="display notfound-title">This page is <em>procrastinating.</em></h1>
    <p class="lead">It didn't show up. Your plan still can.</p>
    <div class="notfound-actions">
      <a class="btn btn-primary btn-lg" href="/app.html">Get my plan</a>
      <a class="btn btn-ghost btn-lg" href="/">Back to home</a>
    </div>
  </main>
</body>
</html>
